name: Build All Platforms

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-s"

jobs:
  build-rust-core:
    name: Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/protocol-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/protocol-rs/Cargo.lock') }}
      - name: Build Protocol Library
        working-directory: core/protocol-rs
        run: cargo build --release --all-targets
      - name: Test Protocol Library
        working-directory: core/protocol-rs
        run: cargo test --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-core
          path: core/protocol-rs/target/release/*.so

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-rust-core
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
      - name: Build Rust JNI Libraries
        run: |
          cd core/protocol-rs
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../android/app/src/main/jniLibs build --release
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Build Release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build-rust-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: cd desktop/tauri-app && npm install
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/tauri-app
          args: --target x86_64-pc-windows-msvc
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/tauri-app/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: build-rust-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: cd desktop/tauri-app && npm install
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/tauri-app
          args: --target universal-apple-darwin
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/tauri-app/src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: build-rust-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm Dependencies
        run: cd desktop/tauri-app && npm install
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/tauri-app
          args: --target x86_64-unknown-linux-gnu
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: desktop/tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop/tauri-app/src-tauri/target/release/bundle/deb/*.deb
