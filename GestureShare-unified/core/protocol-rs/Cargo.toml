[package]
name = "gesture_protocol"
version = "0.1.0"
edition = "2021"
description = "Shared cross-platform protocol for GestureShare"
license = "Apache-2.0"

[lib]
name = "gesture_protocol"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
rand = "0.8"
p384 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
hkdf = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
tokio = { version = "1.35", features = ["full"] }
quinn = "0.10"
rcgen = "0.12"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
mdns-sd = "0.10"
crc32fast = "1.3"
flate2 = "1.0"
tracing = "0.1"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
