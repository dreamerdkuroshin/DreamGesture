name: Build & Release

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-all:
    name: Build All Platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Directory
        run: |
          mkdir -p release-assets
          echo "DreamGesture v1.0.0" > release-assets/VERSION.txt
          echo "Build date: $(date)" >> release-assets/VERSION.txt

      - name: Create Android APK Placeholder
        run: |
          mkdir -p release-assets/android
          echo "# DreamGesture Android APK" > release-assets/android/README.txt
          echo "" >> release-assets/android/README.txt
          echo "This is a placeholder for the Android APK." >> release-assets/android/README.txt
          echo "The actual APK will be built once the Android build environment is configured." >> release-assets/android/README.txt
          echo "" >> release-assets/android/README.txt
          echo "To build locally:" >> release-assets/android/README.txt
          echo "  cd GestureShare" >> release-assets/android/README.txt
          echo "  ./gradlew assembleRelease" >> release-assets/android/README.txt
          echo "" >> release-assets/android/README.txt
          echo "The APK will be at: app/build/outputs/apk/release/app-release.apk" >> release-assets/android/README.txt
          echo "DreamGesture Android Placeholder" > release-assets/android/app-release.apk

      - name: Create Windows MSI Placeholder
        run: |
          mkdir -p release-assets/windows
          echo "# DreamGesture Windows Installer" > release-assets/windows/README.txt
          echo "" >> release-assets/windows/README.txt
          echo "This is a placeholder for the Windows MSI installer." >> release-assets/windows/README.txt
          echo "The actual installer will be built once the Tauri build environment is configured." >> release-assets/windows/README.txt
          echo "" >> release-assets/windows/README.txt
          echo "To build locally:" >> release-assets/windows/README.txt
          echo "  cd GestureShare-unified/desktop/tauri-app" >> release-assets/windows/README.txt
          echo "  npm install" >> release-assets/windows/README.txt
          echo "  npm run tauri build" >> release-assets/windows/README.txt
          echo "" >> release-assets/windows/README.txt
          echo "The MSI will be at: src-tauri/target/release/bundle/msi/" >> release-assets/windows/README.txt
          echo "DreamGesture Windows Placeholder" > release-assets/windows/DreamGesture-windows.msi

      - name: Create macOS DMG Placeholder
        run: |
          mkdir -p release-assets/macos
          echo "# DreamGesture macOS Disk Image" > release-assets/macos/README.txt
          echo "" >> release-assets/macos/README.txt
          echo "This is a placeholder for the macOS DMG." >> release-assets/macos/README.txt
          echo "The actual DMG will be built once the Tauri build environment is configured." >> release-assets/macos/README.txt
          echo "" >> release-assets/macos/README.txt
          echo "To build locally:" >> release-assets/macos/README.txt
          echo "  cd GestureShare-unified/desktop/tauri-app" >> release-assets/macos/README.txt
          echo "  npm install" >> release-assets/macos/README.txt
          echo "  npm run tauri build" >> release-assets/macos/README.txt
          echo "" >> release-assets/macos/README.txt
          echo "The DMG will be at: src-tauri/target/release/bundle/dmg/" >> release-assets/macos/README.txt
          echo "DreamGesture macOS Placeholder" > release-assets/macos/DreamGesture-macos.dmg

      - name: Create Linux AppImage Placeholder
        run: |
          mkdir -p release-assets/linux
          echo "# DreamGesture Linux AppImage" > release-assets/linux/README.txt
          echo "" >> release-assets/linux/README.txt
          echo "This is a placeholder for the Linux AppImage." >> release-assets/linux/README.txt
          echo "The actual AppImage will be built once the Tauri build environment is configured." >> release-assets/linux/README.txt
          echo "" >> release-assets/linux/README.txt
          echo "To build locally:" >> release-assets/linux/README.txt
          echo "  cd GestureShare-unified/desktop/tauri-app" >> release-assets/linux/README.txt
          echo "  npm install" >> release-assets/linux/README.txt
          echo "  npm run tauri build" >> release-assets/linux/README.txt
          echo "" >> release-assets/linux/README.txt
          echo "The AppImage will be at: src-tauri/target/release/bundle/appimage/" >> release-assets/linux/README.txt
          echo "DreamGesture Linux Placeholder" > release-assets/linux/DreamGesture-linux.AppImage

      - name: Package All
        run: |
          cd release-assets
          zip -r ../DreamGesture-v1.0.0-all.zip .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dreamgesture-release
          path: release-assets/

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: DreamGesture-v1.0.0-all.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
